# Keeps the free Supabase server from pausing (it pauses after 7 days with no requests).
# Runs every 3 days at 06:00 UTC, and can be started by hand from the Actions tab.
# GitHub turns off scheduled workflows after 60 days without repo activity, so the
# second step adds an empty commit when the last commit is older than 50 days.
name: Keep server awake

on:
  schedule:
    - cron: "0 6 */3 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (read one setting)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          code=$(curl -s -o /tmp/out.json -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/app_settings?select=key&limit=1" \
            -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY")
          echo "HTTP $code"
          cat /tmp/out.json; echo
          test "$code" = "200"

      - name: Keep this schedule alive (empty commit every 50 days)
        uses: actions/checkout@v4
      - run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((50 * 86400)) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled server ping active"
            git push
          else
            echo "Recent activity found; no commit needed."
          fi
