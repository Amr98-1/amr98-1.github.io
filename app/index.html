<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!-- Replaced by `flutter build web --base-href /app/` -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Fluent: تعلّم الإنجليزية جملةً بعد جملة">
  <meta name="theme-color" content="#0B0B0C">

  <!-- Opens full screen when added to the iPhone / Android home screen -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fluent">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Fluent</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { margin: 0; height: 100%; background: #0B0B0C; }
    /* splash shown while the app loads */
    #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
              font-family: system-ui, sans-serif; color: #9A968F; font-size: 14px; transition: opacity .4s; }
    #splash img { width: 84px; height: 84px; animation: pulse 1.6s ease-in-out infinite; }
    @keyframes pulse { 50% { transform: scale(1.06); filter: brightness(1.15); } }
  </style>
</head>
<body>
  <div id="splash"><img src="icons/Icon-192.png" alt="Fluent"><div>جارٍ التحميل…</div></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) { s.style.opacity = 0; setTimeout(function () { s.remove(); }, 400); }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
